# The development Worker is deliberately inert. It has its own name, placeholder
# bindings that exist only in local simulation, and no provider URL or list
# configuration, so a development deploy cannot read or write production KV, R2
# or Listmonk. Local-only values belong in `.dev.vars`, which is ignored.
name = "newsletter-api-dev"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Placeholder namespace for the local `wrangler dev` simulation. It does not
# exist in the account, so deploying this environment fails instead of writing
# to production data. Create a dedicated namespace first if a development deploy
# is ever needed.
[[kv_namespaces]]
binding = "NEWSLETTER_SUBSCRIBERS"
id = "dev-local-only-placeholder"

# Placeholder bucket, simulated locally and absent from the account.
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "newsletter-dev-local"

# The coordinator is one serialized object per address, so a subscribe and a
# later unsubscribe cannot interleave. Local simulation only; the production
# binding is declared under [env.production] below.
[durable_objects]
bindings = [
  { name = "SUBSCRIPTION_COORDINATOR", class_name = "SubscriptionCoordinator" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SubscriptionCoordinator"]

# Development has no Listmonk or Plunk configuration on purpose: a development
# Worker must not email real subscribers. Supply local values through
# `.dev.vars` when testing that path.
[vars]
ENVIRONMENT = "development"
COORDINATOR_MODE = "on"
ALLOWED_ORIGIN = "http://localhost:1313,http://localhost:3000"

# Production environment
[env.production]
name = "newsletter-api"

[[env.production.durable_objects.bindings]]
name = "SUBSCRIPTION_COORDINATOR"
class_name = "SubscriptionCoordinator"

# Production KV namespace binding
[[env.production.kv_namespaces]]
binding = "NEWSLETTER_SUBSCRIBERS"
id = "f98d1bbfe9924cbaa277fa8da10ba2ea"

# Production R2 bucket binding (EU jurisdiction)
[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "static-eu"
jurisdiction = "eu"

# Production environment variables
[env.production.vars]
ALLOWED_ORIGIN = "https://philippdubach.com,https://www.philippdubach.com,https://phil-dubach.com"
ENVIRONMENT = "production"
# Rollback lever: deploying this same code with "legacy" keeps the Durable Object
# class and its pending operations, and returns writes to the inline path.
COORDINATOR_MODE = "on"
# Overall budget for one provider phase, well under the 30-second Durable Object
# reset threshold that applies while blockConcurrencyWhile is held.
PROVIDER_BUDGET_MS = "20000"
LINKEDIN_NEWSLETTER_URLS = "https://www.linkedin.com/pulse/ai-lab-60b-cursor-25b-anthropic-chinese-open-weight-triple-dubach-ltbae"
LISTMONK_API_URL = "https://mail.philippdubach.com"
LISTMONK_LIST_ID = "3"
LISTMONK_WELCOME_TEMPLATE_ID = "5"
