<!doctype html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light only">
    <base target="_blank">
    <style type="text/css">
        :root { color-scheme: light only; }
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        .content h2 { margin: 0 0 20px 0; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 700; color: #1a1a1a; line-height: 1.25; letter-spacing: -0.02em; }
        .content p, .content li { font-family: Georgia, 'Times New Roman', Times, serif; font-size: 16px; line-height: 1.65; color: #333333; }
        .content a { color: #c8102e; text-decoration: none; }
        .content a.button { display: inline-block; background-color: #c8102e; border-radius: 6px; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; line-height: 48px; padding: 0 32px; }
        @media screen and (max-width: 600px) {
            .wrapper { width: 100% !important; max-width: 100% !important; }
            .mobile-padding { padding-left: 20px !important; padding-right: 20px !important; }
        }
    </style>
</head>
